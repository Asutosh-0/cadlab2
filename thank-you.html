<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | CadlaB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .thank-you {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
        }
        
        .thank-card {
            max-width: 650px;
            padding: 55px 30px;
            background: white;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }
        
        .success-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #e5f6eb;
            color: #168344;
            display: grid;
            place-items: center;
            font-size: 38px;
            margin: 0 auto 25px;
        }
    </style>
</head>

<body>

    <section class="thank-you">

        <div class="thank-card">

            <div class="success-icon">✓</div>

            <div class="eyebrow">ENQUIRY SUBMITTED</div>

            <h1 class="display lg">
                Thank You!
            </h1>

            <p class="lead mx-auto">
                Your enquiry has been submitted successfully. Our team will review your requirements and contact you soon.
            </p>

            <p>
                For urgent enquiries:
                <a href="mailto:info@cadlab.co.in">
                    info@cadlab.co.in
                </a>
            </p>

            <a href="index.html" class="btn gold mt-3">
                Back to Home ↗
            </a>

        </div>

    </section>

</body>

</html>
